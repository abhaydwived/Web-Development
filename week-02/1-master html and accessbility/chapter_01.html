<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- It tells the browser to use the UTF-8 encoding to correctly interpret and display the text on the web page. -->

    <!-- Unicode Transformation Format, 8-bit -->
    <!-- UTF-8 is a way to encode characters from the Unicode standard, which assigns a unique number (called a code point) to every character, symbol, or emoji used in human languages. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- controls the viewport settings of a web page -->

<!-- name="viewport":
Specifies that the tag is setting the viewport properties for the page. -->

<!-- content="width=device-width":
Sets the width of the viewport to match the width of the device's screen.
Ensures that the layout scales properly on different screen sizes without horizontal scrolling. -->

<!-- initial-scale=1.0:
Sets the initial zoom level of the page.
1.0 means the page is displayed at 100% of its normal size without zooming in or out. -->

    <title>Document</title>
</head>
<body>
    <p class="and">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Iusto, ex.
    </p>
    <!-- have generated this text using lorem -->
</body>
</html>
