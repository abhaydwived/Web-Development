<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try And Test</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        nav {
            background-color: aqua;
            padding: 20px 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20vw;
        }
        nav div ul
        {
            display: flex;
            gap: 20px;
            list-style-type: none;
            cursor: pointer;
            
        }
        nav div button{
            
            background-color: #1311a8;
            color: #fff;
            cursor: pointer;
        }
        .logo{
            display: flex;
            justify-content: flex-end;
        }
        

    </style>
</head>
<body>
    <div class="tryntest">
        <nav>
            <div class="logo">
                LOGO
            </div>
            <div>
                <ul>
                    <li>Home</li>
                    <li>Try</li>
                    <li>About us</li>
                    <li>Contact</li>
                </ul>
            </div>
            <div>
                <button>SignUp</button>
                <button>Login</button>
            </div>
        </nav>
    </div>
    
</body>
</html>
